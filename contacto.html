    <section class="contenedor-form">
        <form class="form-datos" method="post">
            <label for="name">Nombre completo:</label>
            <input type="text" id="name" name="name" placeholder="Introduce tu nombre completo" required>
            <label for="tel">Teléfono:</label>
            <input type="tel" id="tel" name="tel" placeholder="Introduce tu teléfono" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Introduce tu correo electrónico" required>
            <label for="message">Mensaje:</label><!--for y id deben de ser iguales-->
            <textarea id="message" name="message" rows="10" cols="50" placeholder="Introduce tu mensaje lo que quieras escribir" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>
